name: Check standalone Cloudflare build
on:
  push:
    branches: [main, codex/cloudflare-d1-only]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Bundle Worker without publishing
        run: npx --yes wrangler@4.92.0 deploy --dry-run --outdir dist/check
